name: Unified Download Workflow

on:
  push:
    branches: [main]

jobs:
  download:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'download:')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl wget zip jq ffmpeg python3 python3-pip
          python3 -m pip install --upgrade pip
          python3 -m pip install telethon requests
          sudo curl -L -o /usr/local/bin/yt-dlp "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_linux"
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5

      - name: Setup YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [[ -n "$YT_COOKIES" ]]; then
            mkdir -p ~/.cache/yt-dlp/youtube
            echo "$YT_COOKIES" > ~/.cache/yt-dlp/youtube/cookies.txt
          fi

      - name: Ensure scripts are executable
        run: |
          chmod +x .github/workflows/scripts/tg_download.py \
                   .github/workflows/scripts/tg_upload.py \
                   .github/workflows/scripts/bale_upload.py

      - name: Parse commit message and process
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_STRING_SESSION: ${{ secrets.TG_STRING_SESSION }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_OWNER_CHAT_ID: ${{ secrets.BALE_OWNER_CHAT_ID }}
        run: |
          set +e
          COMMIT_MSG=$(git log -1 --pretty=%B)

          LOG_DIR="downloads/logs"
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/$(date -u +%Y%m%d%H%M%S).txt"
          STATUS_FILE="/tmp/unified-download-status"
          : > "$LOG_FILE"
          : > "$STATUS_FILE"
          exec > >(tee -a "$LOG_FILE") 2>&1

          total_requested=0
          total_success=0
          total_failed=0

          BALE_TARGET="$BALE_OWNER_CHAT_ID"

          log_ok()   { total_success=$((total_success+1)); echo "OK: $1"; }
          log_fail() { total_failed=$((total_failed+1)); echo "FAIL: $1"; }

          sanitize_filename() {
            local name="$1"
            name=$(basename "$name")
            name=$(printf '%s' "$name" | sed 's/[^a-zA-Z0-9._-]/_/g; s/__*/_/g; s/^_//; s/_$//')
            name=$(printf '%s' "$name" | tr ' ' '_')
            [[ -n "$name" ]] && printf '%s\n' "$name" || printf 'download_%s.file\n' "$(date +%s)"
          }

          sanitize_path() {
            local path="$1"
            path="${path#/}"
            path=$(printf '%s' "$path" | sed 's#/\.\.##g; s#/\.\./##g; s#//*#/#g')
            [[ -n "$path" && "$path" != */ ]] && path="${path}/"
            printf '%s' "$path"
          }

          detect_url_type() {
            local url="$1"
            if echo "$url" | grep -qiE '(youtube\.com|youtu\.be)'; then
              echo "youtube"
            elif echo "$url" | grep -qiE '(t\.me|telegram\.me|telegram\.dog)'; then
              echo "telegram"
            else
              echo "general"
            fi
          }

          get_base_path() {
            case "$1" in
              youtube) echo "downloads/youtube/" ;;
              telegram) echo "downloads/telegram/" ;;
              *) echo "downloads/general/" ;;
            esac
          }

          file_is_usable() {
            local file="$1"
            [[ -s "$file" ]] || return 1
            head -c 512 "$file" | grep -qiE '<html|<!doctype html|<head>' && return 1
            return 0
          }

          download_general() {
            local url="$1"
            local output="$2"
            mkdir -p "$(dirname "$output")"
            rm -f "$output"

            aria2c --auto-file-renaming=false --allow-overwrite=true --file-allocation=none -x 16 -s 16 -k 1M -d "$(dirname "$output")" -o "$(basename "$output")" "$url" && file_is_usable "$output" && return 0
            rm -f "$output"
            curl -fL --retry 2 --connect-timeout 30 -o "$output" "$url" && file_is_usable "$output" && return 0
            rm -f "$output"
            wget --tries=2 --timeout=30 -O "$output" "$url" && file_is_usable "$output" && return 0
            rm -f "$output"
            return 1
          }

          download_telegram() {
            local url="$1"; local out_dir="$2"; local base_name="$3"
            mkdir -p "$out_dir"
            local json_out
            json_out=$(python3 .github/workflows/scripts/tg_download.py "$url" "$out_dir" "$base_name" 2>/tmp/tg_err.log)
            local rc=$?
            if [[ $rc -eq 0 || $rc -eq 9 ]]; then
              echo "$json_out" > /tmp/tg_last_result.json
              return $rc
            fi
            echo "Telegram error: $(cat /tmp/tg_err.log)"
            return $rc
          }

          upload_to_telegram() {
            local target="$1"; local file_path="$2"; local caption="$3"
            [[ ! -f "$file_path" || ! -s "$file_path" ]] && return 12
            if [[ -n "$caption" ]]; then
              python3 .github/workflows/scripts/tg_upload.py "$target" "$file_path" --caption "$caption"
            else
              python3 .github/workflows/scripts/tg_upload.py "$target" "$file_path"
            fi
          }

          upload_to_bale() {
            local file_path="$1"; local caption="$2"
            [[ ! -f "$file_path" || ! -s "$file_path" ]] && return 22
            [[ -z "$BALE_BOT_TOKEN" ]] && return 23
            [[ -z "$BALE_TARGET" ]] && return 24
            if [[ -n "$caption" ]]; then
              python3 .github/workflows/scripts/bale_upload.py "$BALE_TARGET" "$file_path" --caption "$caption"
            else
              python3 .github/workflows/scripts/bale_upload.py "$BALE_TARGET" "$file_path"
            fi
          }

          split_large_file() {
            local filepath="$1"
            [[ -f "$filepath" ]] || return 0
            local filesize; filesize=$(stat -c%s "$filepath" 2>/dev/null)
            local max_size=$((90 * 1024 * 1024))
            [[ "$filesize" -le "$max_size" ]] && return 0

            local dir full_name name_no_ext split_dir
            dir=$(dirname "$filepath")
            full_name=$(basename "$filepath")
            name_no_ext="${full_name%.*}"
            split_dir="${dir}/${name_no_ext}"
            mkdir -p "$split_dir"
            zip -0 -s 90m -j "${split_dir}/${full_name}.zip" "$filepath"
            rm -f "$filepath"
          }

          in_block=false
          block_url=""
          block_filename=""
          block_path=""
          block_quality="720"
          block_audio_only=false
          block_playlist=false
          block_target="me"
          block_caption=""
          block_upload_telegram=false
          block_upload_bale=false
          block_no_keep=false

          process_block() {
            [[ -z "$block_url" ]] && return
            total_requested=$((total_requested + 1))

            local url_type base_path final_path output_file safe_name
            url_type=$(detect_url_type "$block_url")
            base_path=$(get_base_path "$url_type")
            final_path="${base_path}${block_path}"
            mkdir -p "$final_path"

            if [[ "$url_type" == "youtube" ]]; then
              touch /tmp/yt_download_marker
              local yt_opts=()

              [[ "$block_filename" == *.mp3 ]] && block_audio_only=true
              [[ "$block_audio_only" == true ]] && yt_opts+=(--extract-audio --audio-format mp3)
              [[ "$block_audio_only" != true && "$block_quality" != "best" ]] && yt_opts+=(--format "bv*[height=$block_quality]+ba/b[height=$block_quality]/bv*+ba/b" --merge-output-format mp4)
              [[ "$block_playlist" == true ]] && yt_opts+=(--yes-playlist) || yt_opts+=(--no-playlist)

              if [[ -n "$block_filename" ]]; then
                safe_name=$(sanitize_filename "${block_filename%.*}")
                yt_opts+=(-o "${final_path}${safe_name}.%(ext)s")
              else
                yt_opts+=(-o "${final_path}%(title)s.%(ext)s")
              fi

              [[ -f "$HOME/.cache/yt-dlp/youtube/cookies.txt" ]] && yt_opts+=(--cookies "$HOME/.cache/yt-dlp/youtube/cookies.txt")
              yt_opts+=("$block_url")

              yt-dlp --no-progress --js-runtime deno "${yt_opts[@]}"
              if [[ $? -ne 0 ]]; then log_fail "YouTube download failed"; return; fi

              output_file=$(find "$final_path" -maxdepth 1 -type f -newer /tmp/yt_download_marker | head -n1)
              [[ -z "$output_file" ]] && log_fail "YouTube output not found" && return

            elif [[ "$url_type" == "telegram" ]]; then
              safe_name=$(sanitize_filename "${block_filename:-telegram_$(date +%s)}")
              download_telegram "$block_url" "$final_path" "${safe_name%.*}"
              rc=$?

              if [[ $rc -eq 0 ]]; then
                mapfile -t tg_files < <(jq -r '.files[]?' /tmp/tg_last_result.json 2>/dev/null)
                [[ ${#tg_files[@]} -eq 0 ]] && log_fail "Telegram returned no files" && return

                for f in "${tg_files[@]}"; do
                  if [[ "$block_upload_telegram" == true ]]; then
                    upload_to_telegram "${block_target:-me}" "$f" "$block_caption" && log_ok "Uploaded to Telegram: $f" || log_fail "Upload to Telegram failed: $f"
                  fi
                  if [[ "$block_upload_bale" == true ]]; then
                    upload_to_bale "$f" "$block_caption" && log_ok "Uploaded to Bale: $f" || log_fail "Upload to Bale failed: $f"
                  fi

                  if [[ "$block_no_keep" == true ]]; then
                    rm -f "$f"
                  else
                    split_large_file "$f"
                  fi
                done

                log_ok "Telegram download succeeded"
                return
              elif [[ $rc -eq 9 ]]; then
                ext_url=$(jq -r '.external_url // empty' /tmp/tg_last_result.json 2>/dev/null)
                [[ -z "$ext_url" ]] && log_fail "Telegram webpage-only without external_url" && return
                output_file="${final_path}${safe_name}"
                download_general "$ext_url" "$output_file" || { log_fail "External URL download failed"; return; }
              else
                log_fail "Telegram download failed (code=$rc)"
                return
              fi

            else
              [[ -z "$block_filename" ]] && block_filename=$(basename "${block_url%%\?*}")
              output_file="${final_path}$(sanitize_filename "$block_filename")"
              download_general "$block_url" "$output_file" || { log_fail "General download failed"; return; }
            fi

            # Upload order: Telegram -> Bale
            if [[ "$block_upload_telegram" == true ]]; then
              upload_to_telegram "${block_target:-me}" "$output_file" "$block_caption" && log_ok "Uploaded to Telegram" || log_fail "Upload to Telegram failed"
            fi
            if [[ "$block_upload_bale" == true ]]; then
              upload_to_bale "$output_file" "$block_caption" && log_ok "Uploaded to Bale" || log_fail "Upload to Bale failed"
            fi

            # Keep / no-keep
            if [[ "$block_no_keep" == true ]]; then
              rm -f "$output_file"
            else
              split_large_file "$output_file"
            fi

            log_ok "Download succeeded"
          }

          while IFS= read -r line; do
            line="${line//$'\r'/}"
            line="$(echo "$line" | sed 's/[[:space:]]*$//')"

            if echo "$line" | grep -q '^download:$'; then
              [[ "$in_block" == true ]] && process_block
              in_block=true
              block_url=""
              block_filename=""
              block_path=""
              block_quality="720"
              block_audio_only=false
              block_playlist=false
              block_target="me"
              block_caption=""
              block_upload_telegram=false
              block_upload_bale=false
              block_no_keep=false
              continue
            fi

            [[ "$in_block" != true || -z "$line" ]] && continue

            if echo "$line" | grep -q '|'; then
              block_url=$(echo "$line" | cut -d'|' -f1 | xargs)
              block_filename=$(echo "$line" | cut -d'|' -f2 | xargs)
            elif echo "$line" | grep -q '^path:'; then
              block_path=$(sanitize_path "$(echo "$line" | sed 's/^path:[[:space:]]*//' | xargs)")
            elif echo "$line" | grep -q '^quality:'; then
              block_quality=$(echo "$line" | sed 's/^quality:[[:space:]]*//' | xargs)
            elif echo "$line" | grep -q '^audio-only$'; then
              block_audio_only=true
            elif echo "$line" | grep -q '^playlist$'; then
              block_playlist=true
            elif echo "$line" | grep -q '^target:'; then
              block_target=$(echo "$line" | sed 's/^target:[[:space:]]*//' | xargs)
            elif echo "$line" | grep -q '^caption:'; then
              block_caption=$(echo "$line" | sed 's/^caption:[[:space:]]*//')
            elif echo "$line" | grep -q '^upload-telegram$'; then
              block_upload_telegram=true
            elif echo "$line" | grep -q '^upload-bale$'; then
              block_upload_bale=true
            elif echo "$line" | grep -q '^no-keep$'; then
              block_no_keep=true
            elif [[ -z "$block_url" ]] && echo "$line" | grep -qE '^https?://'; then
              block_url=$(echo "$line" | xargs)
            fi
          done <<< "$COMMIT_MSG"

          [[ "$in_block" == true ]] && process_block

          if [[ $total_failed -gt 0 && $total_success -eq 0 ]]; then
            echo "all_failed=true" > "$STATUS_FILE"
          else
            echo "all_failed=false" > "$STATUS_FILE"
          fi

      - name: Commit downloaded files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status -s downloads/) ]]; then
            git add downloads/
            git commit -m "Add downloaded artifacts [skip ci]"
            git push
          fi

      - name: Check if all operations failed
        if: always()
        run: |
          if grep -q '^all_failed=true$' /tmp/unified-download-status 2>/dev/null; then
            exit 1
          fi
