name: Unified Download Workflow
on:
  push:
    branches:
      - main

jobs:
  download:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'download:')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl wget zip jq ffmpeg

          # Install yt-dlp nightly
          sudo curl -L -o /usr/local/bin/yt-dlp "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_linux"
          sudo chmod a+rx /usr/local/bin/yt-dlp

          # Install Deno for yt-dlp JavaScript runtime (bypasses YouTube bot detection)
          curl -fsSL https://deno.land/x/install/install.sh | sh -s v2.4.5
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Setup YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [[ -n "$YT_COOKIES" ]]; then
            mkdir -p ~/.cache/yt-dlp/youtube
            printf '%s\n' "$YT_COOKIES" > ~/.cache/yt-dlp/youtube/cookies.txt
            echo "Cookies installed ($(wc -l < ~/.cache/yt-dlp/youtube/cookies.txt) lines)"
          else
            echo "No YOUTUBE_COOKIES secret set — YouTube may be blocked by bot detection"
          fi

      - name: Parse commit message and download files
        run: |
          set +e

          COMMIT_MSG=$(git log -1 --pretty=%B)
          LOG_DIR="downloads/logs"
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/$(date -u +%Y%m%d%H%M%S).txt"
          STATUS_FILE="/tmp/unified-download-status"
          : > "$LOG_FILE"
          : > "$STATUS_FILE"
          exec > >(tee -a "$LOG_FILE") 2>&1

          total_requested=0
          total_success=0
          total_failed=0

          log_ok() {
            local msg="$1"
            total_success=$((total_success + 1))
            echo "OK: $msg"
          }

          log_fail() {
            local msg="$1"
            total_failed=$((total_failed + 1))
            echo "FAIL: $msg"
          }

          sanitize_filename() {
            local name="$1"
            name=$(basename "$name")
            # Replace anything that isn't alphanumeric, dot, underscore, or hyphen
            name=$(printf '%s' "$name" | sed 's/[^a-zA-Z0-9._-]/_/g; s/__*/_/g; s/^_//;s/_$//')
            name=$(printf '%s' "$name" | tr ' ' '_')
            [[ -n "$name" ]] && printf '%s\n' "$name" || printf 'download_%s.file\n' "$(date +%s)"
          }

          sanitize_path() {
            local path="$1"
            path="${path#/}"
            path=$(printf '%s' "$path" | sed 's#/\.\.##g; s#/\.\./##g; s#//*#/#g')
            if [[ -n "$path" && "$path" != */ ]]; then
              path="${path}/"
            fi
            printf '%s' "$path"
          }

          get_base_path() {
            case "$1" in
              youtube) echo "downloads/youtube/" ;;
              telegram) echo "downloads/telegram/" ;;
              *) echo "downloads/general/" ;;
            esac
          }

          get_final_path() {
            local url_type="$1"
            local user_path="$2"
            local base
            base=$(get_base_path "$url_type")
            if [[ -n "$user_path" ]]; then
              echo "${base}${user_path}"
            else
              echo "${base}"
            fi
          }

          file_is_usable() {
            local file="$1"
            [[ -s "$file" ]] || return 1
            if head -c 512 "$file" | grep -qiE '<html|<!doctype html|<head>'; then
              return 1
            fi
            return 0
          }

          download_general() {
            local url="$1"
            local output="$2"
            mkdir -p "$(dirname "$output")"
            rm -f "$output"

            echo "Trying aria2c..."
            if aria2c --auto-file-renaming=false --allow-overwrite=true --file-allocation=none -x 16 -s 16 -k 1M -d "$(dirname "$output")" -o "$(basename "$output")" "$url" && file_is_usable "$output"; then
              return 0
            fi

            echo "Trying curl..."
            rm -f "$output"
            if curl -fL --retry 2 --connect-timeout 30 -o "$output" "$url" && file_is_usable "$output"; then
              return 0
            fi

            echo "Trying wget..."
            rm -f "$output"
            if wget --tries=2 --timeout=30 -O "$output" "$url" && file_is_usable "$output"; then
              return 0
            fi

            rm -f "$output"
            return 1
          }

          download_telegram() {
            local url="$1"
            local output="$2"

            echo "Trying telegramdownloader.net API..."
            local response
            response=$(curl -s -m 30 -X POST \
              -H "User-Agent: Mozilla/5.0" \
              -d "telegram_link=$url" \
              https://telegramdownloader.net/proxy.php 2>/dev/null)

            local download_url file_name
            download_url=$(echo "$response" | jq -r '.data.data.link' 2>/dev/null)
            file_name=$(echo "$response" | jq -r '.data.data.file_name' 2>/dev/null)

            if [[ -n "$download_url" && "$download_url" != "null" && "$download_url" != "" ]]; then
              # Convert spaces to dashes in URL
              local corrected_url
              corrected_url=$(echo "$download_url" | sed 's/%20/-/g; s/ /-/g')

              # Use the final output path directly
              echo "API returned URL and filename: $file_name"
              if download_general "$corrected_url" "$output"; then
                echo "Downloaded via telegramdownloader.net"
                return 0
              fi
            else
              echo "telegramdownloader.net API returned no URL (response: $(echo "$response" | head -c 200))"
            fi
            return 1
          }

          split_large_file() {
            local filepath="$1"
            [[ -f "$filepath" ]] || return 0

            local filesize
            filesize=$(stat -c%s "$filepath" 2>/dev/null)
            local max_size=$((90 * 1024 * 1024))

            if [[ "$filesize" -le "$max_size" ]]; then
              return 0
            fi

            echo "File is $((${filesize}/1024/1024))MB, splitting into 90MB parts..."

            local dir
            dir=$(dirname "$filepath")
            local full_name
            full_name=$(basename "$filepath")
            local name_no_ext="${full_name%.*}"

            local split_dir="${dir}/${name_no_ext}"
            mkdir -p "$split_dir"

            zip -0 -s 90m -j "${split_dir}/${full_name}.zip" "$filepath"

            rm -f "$filepath"

            echo "Split into parts in: ${split_dir}/"
            echo "Files: $(ls -la "${split_dir}/" 2>/dev/null | tail -n +2 | awk '{print $NF}' | paste -sd, -)"
          }

          detect_url_type() {
            local url="$1"
            if echo "$url" | grep -qiE '(youtube\.com|youtu\.be)'; then
              echo "youtube"
            elif echo "$url" | grep -qiE '(t\.me|telegram\.me|telegram\.dog)'; then
              echo "telegram"
            else
              echo "general"
            fi
          }

          echo "=== Parsing commit message ==="
          echo "$COMMIT_MSG"
          echo "=============================="

          in_block=false
          block_url=""
          block_filename=""
          block_path=""
          block_quality="720"
          block_audio_only=false
          block_playlist=false

          process_block() {
            if [[ -z "$block_url" ]]; then
              echo "No URL in block, skipping"
              return
            fi

            total_requested=$((total_requested + 1))
            echo ""
            echo "=== Processing block ==="
            echo "URL: $block_url"
            echo "Filename: ${block_filename:-(auto)}"
            echo "Path: ${block_path:-(default)}"

            local url_type
            url_type=$(detect_url_type "$block_url")

            local final_path
            final_path=$(get_final_path "$url_type" "$block_path")
            mkdir -p "$final_path"

            local output_file=""

            case "$url_type" in
              youtube)
                echo "Downloading with yt-dlp + Deno..."

                # Create marker file before download
                touch /tmp/yt_download_marker

                local yt_opts=()
                if [[ "$block_quality" != "best" ]]; then
                  yt_opts+=(--format "bv*[height=$block_quality]+ba/b[height=$block_quality]/bv*+ba/b")
                fi

                if [[ "$block_audio_only" == true ]]; then
                  yt_opts+=(--extract-audio --audio-format mp3)
                fi

                if [[ "$block_playlist" == true ]]; then
                  yt_opts+=(--yes-playlist)
                else
                  yt_opts+=(--no-playlist)
                fi

                # Force merge into mp4 to ensure audio+video are combined
                yt_opts+=(--merge-output-format mp4)

                if [[ -n "$block_filename" ]]; then
                  local safe_name
                  safe_name=$(sanitize_filename "$block_filename")
                  local ext="${safe_name##*.}"
                  local base="${safe_name%.*}"
                  yt_opts+=(-o "${final_path}${base}.%(ext)s")
                else
                  yt_opts+=(-o "${final_path}%(title)s.%(ext)s")
                fi

                yt_opts+=("$block_url")

                local cookies_arg=()
                if [[ -f "$HOME/.cache/yt-dlp/youtube/cookies.txt" ]]; then
                  cookies_arg+=(--cookies "$HOME/.cache/yt-dlp/youtube/cookies.txt")
                fi

                if yt-dlp --no-progress --js-runtime deno "${cookies_arg[@]}" "${yt_opts[@]}"; then
                  # Find the downloaded file (any file created after marker)
                  output_file=$(find "$final_path" -maxdepth 1 -type f -newer /tmp/yt_download_marker 2>/dev/null | head -n1)

                  if [[ -n "$output_file" && -f "$output_file" ]]; then
                    # Rename if user specified a filename
                    if [[ -n "$block_filename" ]]; then
                      local safe_name
                      safe_name=$(sanitize_filename "$block_filename")
                      local current_ext="${output_file##*.}"
                      local base="${safe_name%.*}"
                      local new_name="${final_path}${base}.${current_ext}"
                      
                      if [[ "$output_file" != "$new_name" ]]; then
                        if [[ -e "$new_name" ]]; then
                          new_name="${final_path}${base}_$(date +%s).${current_ext}"
                        fi
                        mv "$output_file" "$new_name"
                        output_file="$new_name"
                        echo "Renamed to: $(basename "$output_file")"
                      fi
                    fi

                    log_ok "YouTube download succeeded: $block_url"
                    split_large_file "$output_file"
                  else
                    log_fail "YouTube download succeeded but file not found: $block_url"
                  fi
                else
                  log_fail "YouTube download failed: $block_url"
                fi
                ;;

              telegram)
                echo "Downloading from Telegram..."

                local safe_name
                safe_name=$(sanitize_filename "${block_filename:-telegram_$(date +%s).file}")
                output_file="${final_path}${safe_name}"

                if download_telegram "$block_url" "$output_file"; then
                  log_ok "Telegram download succeeded: $block_url"
                  split_large_file "$output_file"
                else
                  log_fail "Telegram download failed: $block_url"
                fi
                ;;

              general)
                echo "Downloading with fallback chain..."

                if [[ -z "$block_filename" ]]; then
                  block_filename=$(basename "${block_url%%\?*}")
                fi
                safe_name=$(sanitize_filename "$block_filename")
                output_file="${final_path}${safe_name}"

                if download_general "$block_url" "$output_file"; then
                  log_ok "General download succeeded: $block_url"
                  split_large_file "$output_file"
                else
                  log_fail "General download failed: $block_url"
                fi
                ;;
            esac

            echo "======================="
          }

          while IFS= read -r line; do
            line="${line//$'\r'/}"
            if echo "$line" | grep -q '^download:'; then
              [[ "$in_block" == true ]] && process_block
              in_block=true
              block_url=""
              block_filename=""
              block_path=""
              block_quality="720"
              block_audio_only=false
              block_playlist=false
              continue
            fi

            [[ "$in_block" != true ]] && continue
            [[ -z "$line" ]] && continue

            if echo "$line" | grep -q '|'; then
              pipe_count=$(echo "$line" | tr -cd '|' | wc -c)
              if [[ "$pipe_count" -gt 1 ]]; then
                echo "Invalid URL line (multiple | separators): $line"
                log_fail "Invalid URL line"
                in_block=false
                continue
              fi
              block_url=$(echo "$line" | cut -d'|' -f1 | xargs)
              block_filename=$(echo "$line" | cut -d'|' -f2 | xargs)
              continue
            fi

            if echo "$line" | grep -q '^path:'; then
              block_path=$(echo "$line" | sed 's/^path:[[:space:]]*//' | xargs)
              block_path=$(sanitize_path "$block_path")
              continue
            fi

            if echo "$line" | grep -q '^quality:'; then
              block_quality=$(echo "$line" | sed 's/^quality:[[:space:]]*//' | xargs)
              continue
            fi

            if echo "$line" | grep -q '^audio-only:[[:space:]]*true'; then
              block_audio_only=true
              continue
            fi

            if echo "$line" | grep -q '^playlist:[[:space:]]*yes'; then
              block_playlist=true
              continue
            fi

            if [[ -z "$block_url" ]] && echo "$line" | grep -qE '^https?://'; then
              block_url=$(echo "$line" | xargs)
            fi
          done <<< "$COMMIT_MSG"

          [[ "$in_block" == true ]] && process_block

          find downloads -name '*.aria2' -delete 2>/dev/null || true

          echo ""
          echo "=== Download summary ==="
          echo "Requested: $total_requested"
          echo "Succeeded: $total_success"
          echo "Failed: $total_failed"
          echo "Log file: $LOG_FILE"

          if [[ "$total_requested" -gt 0 && "$total_success" -eq 0 ]]; then
            echo "all_failed=true" > "$STATUS_FILE"
          else
            echo "all_failed=false" > "$STATUS_FILE"
          fi

          exit 0

      - name: Commit downloaded files and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status -s downloads/) ]]; then
            git add downloads/
            git commit -m "Add downloaded files and logs [skip ci]"
            git push
            echo "Files committed and pushed"
          else
            echo "⚠️ No new files to commit"
          fi

      - name: Check if all downloads failed
        if: always()
        run: |
          if grep -q '^all_failed=true$' /tmp/unified-download-status 2>/dev/null; then