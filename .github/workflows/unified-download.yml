name: Unified Download Workflow
on:
  push:
    branches:
      - main

jobs:
  download:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'download:')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl wget zip jq ffmpeg

          # Install yt-dlp nightly
          sudo curl -L -o /usr/local/bin/yt-dlp "https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_linux"
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5

      - name: Setup YouTube cookies
        env:
          YT_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [[ -n "$YT_COOKIES" ]]; then
            mkdir -p ~/.cache/yt-dlp/youtube
            echo "$YT_COOKIES" > ~/.cache/yt-dlp/youtube/cookies.txt
            echo "Cookies installed ($(wc -l < ~/.cache/yt-dlp/youtube/cookies.txt) lines)"
          else
            echo "No YOUTUBE_COOKIES secret set — YouTube may be blocked by bot detection"
          fi

      - name: Parse commit message and download files
        run: |
          set +e

          COMMIT_MSG=$(git log -1 --pretty=%B)
          LOG_DIR="downloads/logs"
          mkdir -p "$LOG_DIR"
          LOG_FILE="$LOG_DIR/$(date -u +%Y%m%d%H%M%S).txt"
          STATUS_FILE="/tmp/unified-download-status"
          : > "$LOG_FILE"
          : > "$STATUS_FILE"
          exec > >(tee -a "$LOG_FILE") 2>&1

          total_requested=0
          total_success=0
          total_failed=0

          log_ok() {
            local msg="$1"
            total_success=$((total_success + 1))
            echo "OK: $msg"
          }

          log_fail() {
            local msg="$1"
            total_failed=$((total_failed + 1))
            echo "FAIL: $msg"
          }

          sanitize_filename() {
            local name="$1"
            name=$(basename "$name")
            name=$(printf '%s' "$name" | sed 's/[^a-zA-Z0-9._-]/_/g; s/__*/_/g; s/^_//;s/_$//')
            name=$(printf '%s' "$name" | tr ' ' '_')
            [[ -n "$name" ]] && printf '%s\n' "$name" || printf 'download_%s.file\n' "$(date +%s)"
          }

          sanitize_path() {
            local path="$1"
            path="${path#/}"
            path=$(printf '%s' "$path" | sed 's#/\.\.##g; s#/\.\./##g; s#//*#/#g')
            if [[ -n "$path" && "$path" != */ ]]; then
              path="${path}/"
            fi
            printf '%s' "$path"
          }

          get_base_path() {
            case "$1" in
              youtube) echo "downloads/youtube/" ;;
              telegram) echo "downloads/telegram/" ;;
              *) echo "downloads/general/" ;;
            esac
          }

          get_final_path() {
            local url_type="$1"
            local user_path="$2"
            local base
            base=$(get_base_path "$url_type")
            if [[ -n "$user_path" ]]; then
              echo "${base}${user_path}"
            else
              echo "${base}"
            fi
          }

          file_is_usable() {
            local file="$1"
            [[ -s "$file" ]] || return 1
            if head -c 512 "$file" | grep -qiE '<html|<!doctype html|<head>'; then
              return 1
            fi
            return 0
          }

          download_general() {
            local url="$1"
            local output="$2"
            mkdir -p "$(dirname "$output")"
            rm -f "$output"

            echo "Trying aria2c..."
            if aria2c --auto-file-renaming=false --allow-overwrite=true --file-allocation=none -x 16 -s 16 -k 1M -d "$(dirname "$output")" -o "$(basename "$output")" "$url" && file_is_usable "$output"; then
              return 0
            fi

            echo "Trying curl..."
            rm -f "$output"
            if curl -fL --retry 2 --connect-timeout 30 -o "$output" "$url" && file_is_usable "$output"; then
              return 0
            fi

            echo "Trying wget..."
            rm -f "$output"
            if wget --tries=2 --timeout=30 -O "$output" "$url" && file_is_usable "$output"; then
              return 0
            fi

            rm -f "$output"
            return 1
          }

          download_telegram() {
            local url="$1"
            local output="$2"

            echo "Trying telegramdownloader.net API..."
            local response
            response=$(curl -s -m 30 -X POST \
              -H "User-Agent: Mozilla/5.0" \
              -d "telegram_link=$url" \
              https://telegramdownloader.net/proxy.php 2>/dev/null)

            local download_url file_name
            download_url=$(echo "$response" | jq -r '.data.data.link' 2>/dev/null)
            file_name=$(echo "$response" | jq -r '.data.data.file_name' 2>/dev/null)

            if [[ -n "$download_url" && "$download_url" != "null" && "$download_url" != "" ]]; then
              local corrected_url
              corrected_url=$(echo "$download_url" | sed 's/%20/-/g; s/ /-/g')
              echo "API returned URL and filename: $file_name"
              if download_general "$corrected_url" "$output"; then
                echo "Downloaded via telegramdownloader.net"
                return 0
              fi
            else
              echo "telegramdownloader.net API returned no URL (response: $(echo "$response" | head -c 200))"
            fi
            return 1
          }

          split_large_file() {
            local filepath="$1"
            [[ -f "$filepath" ]] || return 0

            local filesize
            filesize=$(stat -c%s "$filepath" 2>/dev/null)
            local max_size=$((90 * 1024 * 1024))

            if [[ "$filesize" -le "$max_size" ]]; then
              return 0
            fi

            echo "File is $((${filesize}/1024/1024))MB, splitting into 90MB parts..."
            local dir=$(dirname "$filepath")
            local full_name=$(basename "$filepath")
            local name_no_ext="${full_name%.*}"
            local split_dir="${dir}/${name_no_ext}"
            mkdir -p "$split_dir"

            zip -0 -s 90m -j "${split_dir}/${full_name}.zip" "$filepath"
            rm -f "$filepath"

            echo "Split into parts in: ${split_dir}/"
          }

          detect_url_type() {
            local url="$1"
            if echo "$url" | grep -qiE '(youtube\.com|youtu\.be)'; then
              echo "youtube"
            elif echo "$url" | grep -qiE '(t\.me|telegram\.me|telegram\.dog)'; then
              echo "telegram"
            else
              echo "general"
            fi
          }

          echo "=== Parsing commit message ==="
          echo "$COMMIT_MSG"
          echo "=============================="

          in_block=false
          block_url=""
          block_filename=""
          block_path=""
          block_quality="720"
          block_audio_only=false
          block_playlist=false

          process_block() {
            if [[ -z "$block_url" ]]; then return; fi
            total_requested=$((total_requested + 1))
            
            local url_type=$(detect_url_type "$block_url")
            local final_path=$(get_final_path "$url_type" "$block_path")
            mkdir -p "$final_path"

            local output_file=""

            case "$url_type" in
              youtube)
                echo "Downloading with yt-dlp + Deno..."
                touch /tmp/yt_download_marker

                local yt_opts=()
                if [[ "$block_filename" == *.mp3 ]]; then
                  block_audio_only=true
                fi

                if [[ "$block_audio_only" == true ]]; then
                  yt_opts+=(--extract-audio --audio-format mp3)
                elif [[ "$block_quality" != "best" ]]; then
                  yt_opts+=(--format "bv*[height=$block_quality]+ba/b[height=$block_quality]/bv*+ba/b" --merge-output-format mp4)
                fi

                if [[ "$block_playlist" == true ]]; then
                  yt_opts+=(--yes-playlist)
                else
                  yt_opts+=(--no-playlist)
                fi

                if [[ -n "$block_filename" ]]; then
                  local safe_name=$(sanitize_filename "${block_filename%.*}")
                  yt_opts+=(-o "${final_path}${safe_name}.%(ext)s")
                else
                  yt_opts+=(-o "${final_path}%(title)s.%(ext)s")
                fi

                yt_opts+=("$block_url")

                if [[ -f "$HOME/.cache/yt-dlp/youtube/cookies.txt" ]]; then
                  yt_opts+=(--cookies "$HOME/.cache/yt-dlp/youtube/cookies.txt")
                fi

                if yt-dlp --no-progress --js-runtime deno "${yt_opts[@]}"; then
                  output_file=$(find "$final_path" -maxdepth 1 -type f -newer /tmp/yt_download_marker 2>/dev/null | head -n1)
                  if [[ -n "$output_file" ]]; then
                    log_ok "YouTube download succeeded: $block_url"
                    split_large_file "$output_file"
                  else
                    log_fail "YouTube download succeeded but file not found"
                  fi
                else
                  log_fail "YouTube download failed: $block_url"
                fi
                ;;
              telegram)
                local safe_name=$(sanitize_filename "${block_filename:-telegram_$(date +%s).file}")
                output_file="${final_path}${safe_name}"
                if download_telegram "$block_url" "$output_file"; then
                  log_ok "Telegram download succeeded"
                  split_large_file "$output_file"
                else
                  log_fail "Telegram download failed"
                fi
                ;;
              general)
                if [[ -z "$block_filename" ]]; then block_filename=$(basename "${block_url%%\?*}"); fi
                output_file="${final_path}$(sanitize_filename "$block_filename")"
                if download_general "$block_url" "$output_file"; then
                  log_ok "General download succeeded"
                  split_large_file "$output_file"
                else
                  log_fail "General download failed"
                fi
                ;;
            esac
          }

          while IFS= read -r line; do
            line="${line//$'\r'/}"
            if echo "$line" | grep -q '^download:'; then
              [[ "$in_block" == true ]] && process_block
              in_block=true
              block_url=""; block_filename=""; block_path=""; block_quality="720"; block_audio_only=false; block_playlist=false
              continue
            fi
            [[ "$in_block" != true || -z "$line" ]] && continue
            if echo "$line" | grep -q '|'; then
              block_url=$(echo "$line" | cut -d'|' -f1 | xargs)
              block_filename=$(echo "$line" | cut -d'|' -f2 | xargs)
            elif echo "$line" | grep -q '^path:'; then
              block_path=$(sanitize_path "$(echo "$line" | sed 's/^path:[[:space:]]*//' | xargs)")
            elif echo "$line" | grep -q '^quality:'; then
              block_quality=$(echo "$line" | sed 's/^quality:[[:space:]]*//' | xargs)
            elif echo "$line" | grep -q '^audio-only:[[:space:]]*true'; then
              block_audio_only=true
            elif echo "$line" | grep -q '^playlist:[[:space:]]*yes'; then
              block_playlist=true
            elif [[ -z "$block_url" ]] && echo "$line" | grep -qE '^https?://'; then
              block_url=$(echo "$line" | xargs)
            fi
          done <<< "$COMMIT_MSG"
          [[ "$in_block" == true ]] && process_block

          echo "all_failed=$([[ $total_failed -gt 0 && $total_success -eq 0 ]] && echo 'true' || echo 'false')" > "$STATUS_FILE"

      - name: Commit downloaded files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s downloads/) ]]; then
            git add downloads/
            git commit -m "Add downloaded files [skip ci]"
            git push
          fi

      - name: Check if all downloads failed
        if: always()
        run: |
          if grep -q '^all_failed=true$' /tmp/unified-download-status 2>/dev/null; then
            exit 1
          fi