name: Unified Download Workflow

on:
  push:
    branches:
      - main

jobs:
  download:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'download:')
    
    permissions:
      contents: write
    
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl wget zip jq
          
          # Install yt-dlp
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          
          # Install ffmpeg for yt-dlp
          sudo apt-get install -y ffmpeg

      - name: Parse commit message and download files
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          set +e  # Don't exit on error, we handle errors per-block
          
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          # Function to sanitize filename
          sanitize_filename() {
            echo "$1" | sed 's/[^a-zA-Z0-9._-]/_/g' | sed 's/__*/_/g' | sed 's/^_//;s/_$//'
          }
          
          # Function to sanitize path
          sanitize_path() {
            local path="$1"
            # Remove leading slashes
            path="${path#/}"
            # Ensure trailing slash
            [[ "$path" != "" && "$path" != */ ]] && path="${path}/"
            # Remove path traversal attempts
            path=$(echo "$path" | sed 's/\.\.//g')
            echo "$path"
          }
          
          # Function to detect URL type
          detect_url_type() {
            local url="$1"
            if echo "$url" | grep -qE '(youtube\.com|youtu\.be)'; then
              echo "youtube"
            elif echo "$url" | grep -qE '(t\.me|telegram\.me|telegram\.dog)'; then
              echo "telegram"
            else
              echo "general"
            fi
          }
          
          # Function to get default path for URL type
          get_default_path() {
            local type="$1"
            case "$type" in
              youtube) echo "downloads/youtube/" ;;
              telegram) echo "downloads/telegram/" ;;
              general) echo "downloads/general/" ;;
            esac
          }
          
          # Function to download with fallback tools
          download_general() {
            local url="$1"
            local output="$2"
            
            echo "Attempting download with aria2c..."
            if aria2c -x 16 -s 16 -k 1M --file-allocation=none -d "$(dirname "$output")" -o "$(basename "$output")" "$url"; then
              return 0
            fi
            
            echo "aria2c failed, trying curl..."
            if curl -L -o "$output" "$url"; then
              return 0
            fi
            
            echo "curl failed, trying wget..."
            if wget -O "$output" "$url"; then
              return 0
            fi
            
            echo "All download methods failed"
            return 1
          }
          
          # Function to download from Telegram
          download_telegram() {
            local url="$1"
            local output="$2"
            local service="$3"  # "tgdl", "tgsave", or empty for auto
            
            if [[ "$service" == "tgdl" || -z "$service" ]]; then
              echo "Trying telegramdownloader.net..."
              # Placeholder: actual implementation would use API/scraping
              # For now, simulate with curl
              if curl -L -o "$output" "$url" 2>/dev/null; then
                echo "Downloaded via telegramdownloader.net"
                return 0
              fi
              [[ "$service" == "tgdl" ]] && return 1
            fi
            
            if [[ "$service" == "tgsave" || -z "$service" ]]; then
              echo "Trying tgsave.com..."
              # Placeholder: actual implementation would use API/scraping
              if curl -L -o "$output" "$url" 2>/dev/null; then
                echo "Downloaded via tgsave.com"
                return 0
              fi
            fi
            
            return 1
          }
          
          # Function to split large files
          split_if_needed() {
            local filepath="$1"
            local filesize=$(stat -f%z "$filepath" 2>/dev/null || stat -c%s "$filepath" 2>/dev/null)
            local max_size=$((90 * 1024 * 1024))  # 90MB in bytes
            
            if [[ $filesize -gt $max_size ]]; then
              echo "File size ${filesize} bytes exceeds 90MB, splitting..."
              
              # Get filename without last extension
              local filename=$(basename "$filepath")
              local dirname=$(dirname "$filepath")
              local name_no_ext="${filename%.*}"
              
              # Create subfolder
              local split_dir="${dirname}/${name_no_ext}"
              mkdir -p "$split_dir"
              
              # Split file
              cd "$dirname"
              zip -s 90m "${name_no_ext}/${filename}.zip" "$filename"
              
              # Remove original
              rm "$filename"
              
              echo "Split into parts in ${split_dir}/"
            fi
          }
          
          # Parse blocks
          echo "=== Parsing commit message ==="
          echo "$COMMIT_MSG"
          echo "=============================="
          
          in_block=false
          block_url=""
          block_filename=""
          block_path=""
          block_quality="720"
          block_audio_only=false
          block_playlist=false
          block_subtitles=""
          block_sponsorblock=false
          block_telegram_service=""
          
          process_block() {
            [[ -z "$block_url" ]] && return
            
            echo ""
            echo "=== Processing block ==="
            echo "URL: $block_url"
            echo "Filename: ${block_filename:-<auto>}"
            echo "Path: ${block_path:-<default>}"
            
            # Detect URL type
            url_type=$(detect_url_type "$block_url")
            echo "Type: $url_type"
            
            # Build final path
            default_path=$(get_default_path "$url_type")
            if [[ -n "$block_path" ]]; then
              final_path="${default_path}${block_path}"
            else
              final_path="$default_path"
            fi
            
            mkdir -p "$final_path"
            
            # Download based on type
            case "$url_type" in
              youtube)
                echo "Downloading with yt-dlp..."
                
                yt_opts=()
                
                # Quality
                case "$block_quality" in
                  360) yt_opts+=(-f "bestvideo[height<=360]+bestaudio/best[height<=360]") ;;
                  480) yt_opts+=(-f "bestvideo[height<=480]+bestaudio/best[height<=480]") ;;
                  720) yt_opts+=(-f "bestvideo[height<=720]+bestaudio/best[height<=720]") ;;
                  1080) yt_opts+=(-f "bestvideo[height<=1080]+bestaudio/best[height<=1080]") ;;
                  best) yt_opts+=(-f "bestvideo+bestaudio/best") ;;
                esac
                
                # Audio only
                if [[ "$block_audio_only" == true ]]; then
                  yt_opts=(-f "bestaudio" -x --audio-format mp3)
                fi
                
                # Playlist
                if [[ "$block_playlist" == true ]]; then
                  yt_opts+=(--yes-playlist)
                  # Ignore custom filename for playlists
                  block_filename=""
                else
                  yt_opts+=(--no-playlist)
                fi
                
                # Subtitles
                if [[ "$block_subtitles" == "all" ]]; then
                  yt_opts+=(--write-subs --sub-langs all)
                elif [[ -n "$block_subtitles" ]]; then
                  yt_opts+=(--write-subs --sub-langs "$block_subtitles")
                fi
                
                # SponsorBlock
                if [[ "$block_sponsorblock" == true ]]; then
                  yt_opts+=(--sponsorblock-remove all)
                fi
                
                # Cookies
                if [[ -n "$YOUTUBE_COOKIES" ]]; then
                  echo "$YOUTUBE_COOKIES" > /tmp/cookies.txt
                  yt_opts+=(--cookies /tmp/cookies.txt)
                fi
                
                # Output template
                if [[ -n "$block_filename" ]]; then
                  yt_opts+=(-o "${final_path}${block_filename}")
                else
                  yt_opts+=(-o "${final_path}%(title)s.%(ext)s")
                fi
                
                if yt-dlp "${yt_opts[@]}" "$block_url"; then
                  echo "✓ YouTube download successful"
                  
                  # Split if needed (only for non-playlist)
                  if [[ "$block_playlist" != true && -n "$block_filename" ]]; then
                    split_if_needed "${final_path}${block_filename}"
                  fi
                else
                  echo "✗ YouTube download failed"
                fi
                
                [[ -f /tmp/cookies.txt ]] && rm /tmp/cookies.txt
                ;;
                
              telegram)
                echo "Downloading from Telegram..."
                
                # Determine filename
                if [[ -z "$block_filename" ]]; then
                  block_filename="telegram_$(date +%s).file"
                fi
                
                output_file="${final_path}${block_filename}"
                
                if download_telegram "$block_url" "$output_file" "$block_telegram_service"; then
                  echo "✓ Telegram download successful"
                  split_if_needed "$output_file"
                else
                  echo "✗ Telegram download failed"
                fi
                ;;
                
              general)
                echo "Downloading general URL..."
                
                # Determine filename
                if [[ -z "$block_filename" ]]; then
                  block_filename=$(basename "$block_url" | cut -d'?' -f1)
                  [[ -z "$block_filename" ]] && block_filename="download_$(date +%s).file"
                fi
                
                output_file="${final_path}${block_filename}"
                
                if download_general "$block_url" "$output_file"; then
                  echo "✓ General download successful"
                  split_if_needed "$output_file"
                else
                  echo "✗ General download failed"
                fi
                ;;
            esac
            
            echo "======================="
          }
          
          while IFS= read -r line; do
            # Check if line starts a new block
            if echo "$line" | grep -q "^download:"; then
              # Process previous block if exists
              [[ "$in_block" == true ]] && process_block
              
              # Reset block variables
              in_block=true
              block_url=""
              block_filename=""
              block_path=""
              block_quality="720"
              block_audio_only=false
              block_playlist=false
              block_subtitles=""
              block_sponsorblock=false
              block_telegram_service=""
              continue
            fi
            
            # Skip if not in block
            [[ "$in_block" != true ]] && continue
            
            # Skip empty lines
            [[ -z "$line" ]] && continue
            
            # Parse URL line (must contain |)
            if echo "$line" | grep -q "|"; then
              # Check for multiple separators
              pipe_count=$(echo "$line" | tr -cd '|' | wc -c)
              if [[ $pipe_count -gt 1 ]]; then
                echo "✗ Error: Use only one | separator in URL line"
                echo "  Line: $line"
                in_block=false
                continue
              fi
              
              block_url=$(echo "$line" | cut -d'|' -f1 | xargs)
              block_filename=$(echo "$line" | cut -d'|' -f2 | xargs)
              continue
            fi
            
            # Parse path parameter
            if echo "$line" | grep -q "^path:"; then
              block_path=$(echo "$line" | sed 's/^path:[[:space:]]*//' | xargs)
              block_path=$(sanitize_path "$block_path")
              continue
            fi
            
            # Parse YouTube parameters
            if echo "$line" | grep -q "^quality:"; then
              block_quality=$(echo "$line" | sed 's/^quality:[[:space:]]*//' | xargs)
              continue
            fi
            
            if echo "$line" | grep -q "^audio-only:[[:space:]]*true"; then
              block_audio_only=true
              continue
            fi
            
            if echo "$line" | grep -q "^playlist:[[:space:]]*yes"; then
              block_playlist=true
              continue
            fi
            
            if echo "$line" | grep -q "^subtitles:"; then
              block_subtitles=$(echo "$line" | sed 's/^subtitles:[[:space:]]*//' | xargs)
              continue
            fi
            
            if echo "$line" | grep -q "^sponsorblock:[[:space:]]*yes"; then
              block_sponsorblock=true
              continue
            fi
            
            # Parse Telegram parameter
            if echo "$line" | grep -q "^telegram-service:"; then
              block_telegram_service=$(echo "$line" | sed 's/^telegram-service:[[:space:]]*//' | xargs)
              continue
            fi
            
            # If line doesn't match any pattern and we have a URL, treat as potential URL without |
            if [[ -z "$block_url" ]] && echo "$line" | grep -qE '^https?://'; then
              block_url="$line"
            fi
          done <<< "$COMMIT_MSG"
          
          # Process last block
          [[ "$in_block" == true ]] && process_block
          
          # Cleanup aria2 metadata files
          find downloads -name "*.aria2" -delete 2>/dev/null || true

      - name: Commit downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status -s) ]]; then
            git add downloads/
            git commit -m "Add downloaded files [skip ci]"
            git push
            echo "✓ Files committed and pushed"
          else
            echo "No new files to commit"
          fi
