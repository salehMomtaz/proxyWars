name: Download files from commit

on:
  push:
    branches:
      - main

jobs:
  download:
    if: contains(github.event.head_commit.message, 'download:')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install aria2
        run: sudo apt-get update && sudo apt-get install -y aria2 zip

      - name: Parse and download
        run: |
          set -euo pipefail

          BODY="${{ github.event.head_commit.message }}"

          mkdir -p downloads

          url_count=0
          max_parallel=4

          declare -a pids=()

          sanitize_filename() {
            echo "$1" | sed 's/[\\:*?"<>|]/-/g'
          }

          sanitize_path() {
            p="$1"
            p="${p//../}"
            p="${p#\/}"
            echo "$p"
          }

          wait_jobs() {
            for pid in "${pids[@]:-}"; do
              wait "$pid" || true
            done
            pids=()
          }

          download_file() {

            url="$1"
            name="$2"
            dest="$3"

            mkdir -p "$dest"

            aria2c \
              --auto-file-renaming=false \
              --allow-overwrite=true \
              --file-allocation=none \
              -d "$dest" \
              -o "$name" \
              "$url" &

            pids+=($!)

            if [ "${#pids[@]}" -ge "$max_parallel" ]; then
              wait_jobs
            fi
          }

          process_block() {

            block_path="$1"

            if [ "${#urls[@]}" -eq 0 ]; then
              return
            fi

            block_path="$(sanitize_path "$block_path")"
            dest="downloads/$block_path"

            for i in "${!urls[@]}"; do

              url="${urls[$i]}"
              name="${names[$i]}"

              echo "Queue download: $url"

              download_file "$url" "$name" "$dest"

            done

            urls=()
            names=()
          }

          declare -a urls=()
          declare -a names=()

          in_block=false

          while IFS= read -r line; do

            line="${line//$'\r'/}"
            line="$(echo "$line" | sed 's/^[ \t]*//;s/[ \t]*$//')"

            [ -z "$line" ] && continue
            [[ "$line" == \#* ]] && continue

            case "$line" in

              download:)
                process_block ""
                in_block=true
              ;;

              path:*)
                if [ "$in_block" = true ]; then
                  path="${line#path:}"
                  path="$(echo "$path" | xargs)"
                  process_block "$path"
                fi
              ;;

              http*)
                if [ "$in_block" != true ]; then
                  continue
                fi

                if [ "$url_count" -ge 100 ]; then
                  echo "Download limit reached"
                  break
                fi

                if [[ "$line" == *"|"* ]]; then
                  url_part="${line%%|*}"
                  name_part="${line##*|}"
                else
                  url_part="$line"
                  name_part="$(basename "$url_part")"
                fi

                
                url_part="$(echo "$url_part" | xargs)"
                name_part="$(echo "$name_part" | xargs)"

                name_part="$(sanitize_filename "$name_part")"

                urls+=("$url_part")
                names+=("$name_part")

                url_count=$((url_count+1))
              ;;

            esac

          done <<< "$BODY"

          process_block ""

          wait_jobs

      - name: Commit files
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add downloads

          if git diff --cached --quiet; then
            echo "No files to commit"
            exit 0
          fi

          git commit -m "Add downloaded files"

          git pull --rebase origin main

          git push
