name: Download from Commit

on:
  push:
    branches:
      - main

jobs:
  downloader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip

      - name: Read commit body
        id: commit
        run: |
          BODY="$(git log -1 --pretty=%B)"
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Parse and download
        run: |
          set -e

          BODY="${{ steps.commit.outputs.body }}"

          mkdir -p tmp_downloads
          mkdir -p downloads

          url_count=0
          declare -a urls
          declare -a names

          sanitize_filename() {
            echo "$1" | sed 's/[\\:*?"<>|]/-/g'
          }

          sanitize_path() {
            p="$1"
            p="$(echo "$p" | sed 's#\.\.##g')"
            p="$(echo "$p" | sed 's#//*#/#g')"
            p="$(echo "$p" | sed 's#^/*##')"
            echo "$p"
          }

          process_block() {
            block_path="$1"

            if [ "${#urls[@]}" -eq 0 ]; then
              echo "No URLs for path $block_path, skipping"
              return
            fi

            block_path="$(sanitize_path "$block_path")"

            if [ -z "$block_path" ]; then
              block_path=""
            fi

            dest="downloads/$block_path"
            mkdir -p "$dest"

            for i in "${!urls[@]}"; do
              url="${urls[$i]}"
              name="${names[$i]}"

              echo "Downloading: $url"

              aria2c -d tmp_downloads -o "$name" "$url" || {
                echo "Failed: $url"
                continue
              }

              src="tmp_downloads/$name"

              base="$name"
              counter=1
              while [ -e "$dest/$base" ]; do
                base="${name%.*}_$counter.${name##*.}"
                counter=$((counter+1))
              done

              size=$(stat -c%s "$src")

              if [ "$size" -gt $((90*1024*1024)) ]; then
                echo "Splitting large file: $base"
                zip -s 90m "$dest/$base.zip" "$src"
              else
                mv "$src" "$dest/$base"
              fi
            done

            urls=()
            names=()
          }

          in_block=false

          while IFS= read -r line; do
            line="$(echo "$line" | tr -d '\r')"
            line="$(echo "$line" | sed 's/^[ \t]*//;s/[ \t]*$//')"

            [ -z "$line" ] && continue
            [[ "$line" == \#* ]] && continue

            case "$line" in

              download:)
                process_block ""
                in_block=true
              ;;

              path:*)
                if [ "$in_block" = true ]; then
                  path="${line#path:}"
                  path="$(echo "$path" | xargs)"
                  process_block "$path"
                fi
              ;;

              http*)
                if [ "$in_block" != true ]; then
                  continue
                fi

                if [ "$url_count" -ge 100 ]; then
                  echo "Download limit reached (100)"
                  break
                fi

                url_part="$(echo "$line" | cut -d '|' -f1 | xargs)"
                name_part="$(echo "$line" | cut -s -d '|' -f2 | xargs)"

                if [ -z "$name_part" ]; then
                  name_part="$(basename "$url_part")"
                fi

                name_part="$(sanitize_filename "$name_part")"

                urls+=("$url_part")
                names+=("$name_part")

                url_count=$((url_count+1))
              ;;

            esac

          done <<< "$BODY"

          process_block ""

          rm -rf tmp_downloads

      - name: Commit files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          files=$(git ls-files -o --exclude-standard downloads)

          count=0
          batch=()

          for f in $files; do
            batch+=("$f")
            count=$((count+1))

            if [ "$count" -eq 5 ]; then
              git add "${batch[@]}"
              git commit -m "Add downloaded files batch"
              git push
              batch=()
              count=0
            fi
          done

          if [ "${#batch[@]}" -gt 0 ]; then
            git add "${batch[@]}"
            git commit -m "Add downloaded files batch"
            git push
          fi
          
